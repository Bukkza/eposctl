name: Release

# Releases the version in Cargo.toml as tag v<version>:
# - automatically when a push to main changes Cargo.toml and that version has no release yet,
# - by hand with "Run workflow" (Actions tab),
# - or when a v* tag is pushed.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "v$ver"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            throw "tag ${{ github.ref_name }} does not match Cargo.toml version $ver"
          }
          $released = gh release view $tag --json tagName 2>$null
          $global:LASTEXITCODE = 0  # "not found" is the normal case, not a failure
          $skip = if ($released) { "true" } else { "false" }
          if ($skip -eq "true") { Write-Host "$tag is already released; nothing to do." }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "skip=$skip" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.skip != 'true'
      - run: cargo test
        if: steps.ver.outputs.skip != 'true'
      - run: cargo build --release
        if: steps.ver.outputs.skip != 'true'

      - name: Installer
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          & $iscc.FullName "/DAppVersion=${{ steps.ver.outputs.version }}" installer\eposctl.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify installer upgrade
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'eposctl-v0.3.3-setup.exe'
          gh release download v0.3.3 --pattern eposctl-setup.exe --output $previous
          if ($LASTEXITCODE) { throw 'Could not download the 0.3.3 installer.' }
          $previousHash = '15e6b48e0f1c4628ea14140ebef25afa2acc6fbe49b038344c4b522a9d5bf616'
          if ((Get-FileHash -LiteralPath $previous).Hash -ne $previousHash) {
            throw 'The 0.3.3 installer checksum does not match.'
          }
          $setup = (Resolve-Path dist\eposctl-setup.exe).Path
          $install = Join-Path $env:RUNNER_TEMP 'eposctl-upgrade-check'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $runCommand = '"' + (Join-Path $install 'eposctl-gui.exe') + '" --minimized'

          function Install-Eposctl($exe, $scenario, $arguments) {
            $log = Join-Path $env:RUNNER_TEMP "eposctl-$scenario.log"
            $flags = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$log`" $arguments"
            $proc = Start-Process -FilePath $exe -ArgumentList $flags -WindowStyle Hidden -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              Get-Content -LiteralPath $log -Tail 50
              throw "Installer failed for $scenario (exit $($proc.ExitCode))."
            }
          }

          Install-Eposctl $previous 'baseline' "/DIR=`"$install`" /TASKS=autostart"
          if ((Get-ItemPropertyValue -LiteralPath $runKey -Name eposctl) -cne $runCommand) {
            throw 'The baseline installer did not enable startup.'
          }
          $configDir = New-Item -ItemType Directory -Path (Join-Path $env:APPDATA 'eposctl') -Force
          $config = Join-Path $configDir.FullName 'config.json'
          '{"lang":"En","close_to_tray":false,"custom_presets":[{"name":"Upgrade test","sound":{"speaker_eq":[0,0,0,0,0,0,0,0,0],"reverb":0,"surround":false}}]}' |
            Set-Content -LiteralPath $config -Encoding utf8NoBOM
          $configHash = (Get-FileHash -LiteralPath $config).Hash

          # Simulate turning off the installer's original startup choice in the app.
          Remove-ItemProperty -LiteralPath $runKey -Name eposctl
          Install-Eposctl $setup 'upgrade-startup-off' '/TASKS=autostart'
          if ((Get-Item -LiteralPath $runKey).GetValueNames() -contains 'eposctl') {
            throw 'Upgrade re-enabled startup.'
          }
          $version = & (Join-Path $install 'eposctl.exe') --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'eposctl ${{ steps.ver.outputs.version }}') {
            throw "Upgrade did not install the expected version ($version)."
          }
          if ((Get-FileHash -LiteralPath $config).Hash -ne $configHash) {
            throw 'Upgrade modified the existing user config.'
          }

          # A portable copy may have enabled startup since the first install.
          Install-Eposctl $previous 'baseline-startup-on' '/TASKS=autostart'
          $null = New-ItemProperty -LiteralPath $runKey -Name eposctl -PropertyType String -Value '"C:\eposctl-portable\eposctl-gui.exe" --minimized' -Force
          Install-Eposctl $setup 'upgrade-startup-on' '/TASKS=""'
          if ((Get-ItemPropertyValue -LiteralPath $runKey -Name eposctl) -cne $runCommand) {
            throw 'Upgrade did not keep startup enabled for the installed copy.'
          }
          if ((Get-FileHash -LiteralPath $config).Hash -ne $configHash) {
            throw 'Upgrade modified the existing user config.'
          }

          # Windows can disable an existing Run entry independently of the app.
          $approvalKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run'
          if (-not (Test-Path -LiteralPath $approvalKey)) {
            $null = New-Item -Path $approvalKey -Force
          }
          $disabled = [Convert]::FromHexString('030000000000000000000000')
          $null = New-ItemProperty -LiteralPath $approvalKey -Name eposctl -Value $disabled -PropertyType Binary -Force
          Install-Eposctl $setup 'upgrade-startup-disabled-by-windows' '/TASKS=autostart'
          $approval = Get-ItemPropertyValue -LiteralPath $approvalKey -Name eposctl
          if ([Convert]::ToHexString($approval) -cne [Convert]::ToHexString($disabled)) {
            throw 'Upgrade changed the Windows startup approval state.'
          }
          if ((Get-ItemPropertyValue -LiteralPath $runKey -Name eposctl) -cne $runCommand) {
            throw 'Upgrade changed the startup command.'
          }
          if ((Get-FileHash -LiteralPath $config).Hash -ne $configHash) {
            throw 'Upgrade modified the existing user config.'
          }

      - name: Package
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          # The installer and the bare exes are attached on their own, so most
          # people never deal with a zip; the zip also carries the README and licence.
          $name = "eposctl-${{ steps.ver.outputs.tag }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/eposctl.exe, target/release/eposctl-gui.exe, README.md, README.zh-CN.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
          Copy-Item target/release/eposctl-gui.exe, target/release/eposctl.exe dist
          Get-ChildItem dist | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: eposctl ${{ steps.ver.outputs.tag }}
          files: dist/*
          body_path: .github/release-notes.md
          generate_release_notes: true
